[package]
name = "diag"
version = "0.1.0"
edition = "2021"
description = "bob-929 diagnostic firmware (Rust) for the MSP430FR2476"

[dependencies]
msp430 = "0.4"
msp430-rt = "0.4"
panic-msp430 = "0.4"
# Two build TARGETS, one tree: select the chip with a feature (see [features]). Each PAC is an
# optional dep pulled in ONLY by its feature, so a build links exactly one. The `crate::pac` alias
# (main.rs) re-exports the selected one, so every module is chip-agnostic.
msp430fr2476 = { path = "../pac/msp430fr2476", optional = true }
msp430fr2355 = { path = "../pac/msp430fr2355", optional = true }
sched = { path = "../crates/sched" }
# Shared per-sensor drivers (one module per sensor, the standard Device convention) — consumed via
# the embedded-hal I2c seam in hal.rs. The SAME driver prod uses: diag no longer forks per-sensor
# code (APDS-9960 migrated off diag/src/apds.rs onto devices::apds9960). An unused device is
# LTO-stripped, so this costs ROM only for what diag actually calls.
devices = { path = "../crates/devices" }
# embedded-hal 1.0 — the bus-trait seam (see hal.rs). Trait definitions only (no code); an unused
# impl is stripped by LTO, so this costs ~0 ROM. Kept as the portability abstraction for the future
# crates/devices drivers + product firmware, independent of the (discretionary) graphics-stack trim.
embedded-hal = "1.0"

[features]
# Chip select — pick exactly one (mutually exclusive; main.rs compile_error!s otherwise).
# `default = ["fr2476"]` keeps a bare `cargo build` = the FR2476 dev board; build the FR2355 target
# with `--no-default-features --features fr2355` (or `just diag build fr2355`).
default = ["fr2476"]
fr2476 = ["dep:msp430fr2476"]
fr2355 = ["dep:msp430fr2355"]

[profile.release]
opt-level = "s"
lto = true

# Fast-iteration profile: identical size-opt (opt-level "s", inherited) but NO LTO. LTO is the
# dominant cost of the emulated amd64-on-arm64 build (a one-crate recompile took ~10 min, almost
# all of it the LTO link), so dropping it slashes the edit→flash loop. Larger than release; if it
# overflows memory.x's 32 KB ROM window, fall back to `just diag build` (LTO release). Use via
# `just diag build fast` (or `just diag dev`, which also flashes).
[profile.fast]
inherits = "release"
lto = false
